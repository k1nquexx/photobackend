# Продакшн-профиль (запуск с -Dspring.profiles.active=prod)
# Строгая валидация существующей схемы БД без автогенерации Hibernate (ddl-auto=validate)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Продакшн база данных (PostgreSQL / MySQL) через переменные окружения
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

# Пул соединений HikariCP для высокой нагрузки
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Корректное завершение работы (Graceful Shutdown)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
