# Graceful Shutdown: корректное завершение активных HTTP-запросов и транзакций при остановке сервера
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# База данных (локальная разработка: файл H2 в ./data/photodb, не стирается между запусками)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/photodb;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

# Пароль администратора и его хэш (задаются через переменные окружения ADMIN_PASSWORD или ADMIN_PASSWORD_HASH)
admin.password=${ADMIN_PASSWORD:admin2026}
admin.password.hash=${ADMIN_PASSWORD_HASH:}

# Конфигурация приложения
app.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,https://photographer.ru}
app.pricing.rate-portrait=1000.00
app.pricing.rate-event=2000.00
app.pricing.addon-express=1000.00
app.pricing.addon-studio=500.00
app.security.token-ttl-seconds=7200
app.security.login-max-requests=5
app.security.login-window-seconds=60
app.security.status-max-requests=10
app.security.status-window-seconds=60
