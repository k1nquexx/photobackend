# База данных: по умолчанию H2 file-based для локальной разработки, 
# с поддержкой переключения на PostgreSQL/MySQL через переменные окружения в проде
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/photodb;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

# Пароль администратора (задается через переменную окружения ADMIN_PASSWORD).
# Если переменная не передана, система генерирует надежный случайный пароль при старте и пишет его в консоль.
admin.password=${ADMIN_PASSWORD:}
