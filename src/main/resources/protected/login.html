<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в панель управления | Фотограф</title>
    <link rel="stylesheet" href="admin.css">
    <style>
        body {
            background-color: #121214;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #1a1a1e;
            border: 1px solid #2a2a30;
            border-radius: 12px;
            padding: 40px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            text-align: center;
        }
        .login-card h2 {
            margin-top: 0;
            color: #c9a96e;
            font-size: 1.5rem;
            margin-bottom: 24px;
        }
        .login-input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 16px;
            background: #25252b;
            border: 1px solid #3d3d45;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        .login-input:focus {
            border-color: #c9a96e;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #c9a96e;
            color: #121214;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .login-btn:hover {
            background: #dfbc7e;
        }
        .login-error {
            display: none;
            margin-top: 16px;
            color: #ff6b6b;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🔒 Вход в панель управления</h2>
        <input type="password" id="adminPassInput" class="login-input" placeholder="Введите пароль администратора..." autofocus autocomplete="current-password">
        <button type="button" class="login-btn" id="loginBtn" onclick="doLogin()">Войти</button>
        <div id="loginError" class="login-error">Неверный пароль администратора</div>
    </div>
    <script>
        async function doLogin() {
            const pass = document.getElementById('adminPassInput').value;
            const err = document.getElementById('loginError');
            err.style.display = 'none';
            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(pass),
                    credentials: 'same-origin'
                });
                if (res.ok) {
                    window.location.reload();
                } else {
                    const text = await res.text();
                    err.textContent = text || 'Неверный пароль';
                    err.style.display = 'block';
                }
            } catch (e) {
                err.textContent = 'Ошибка сети';
                err.style.display = 'block';
            }
        }
        document.getElementById('adminPassInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doLogin();
        });
    </script>
</body>
</html>
