<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление окнами для записи | Фотограф</title>
    <link rel="stylesheet" href="schedule.css">
</head>
<body>

<div class="container">

    <!-- Форма входа -->
    <div id="loginBox">
        <h2>🔒 Вход в управление окнами</h2>
        <input type="password" id="adminPassInput" placeholder="Введите пароль..." autofocus>
        <button onclick="checkAdminPassword()">Войти</button>
        <div id="loginError">Неверный пароль!</div>
    </div>

    <!-- Основная часть расписания -->
    <div id="scheduleApp" class="hidden">
        <div class="header">
            <h1>📅 Управление окнами записи</h1>
            <a href="admin.html">← В админку заявок</a>
        </div>

        <div class="schedule-card">
            <h2>1. Выберите дату для настройки окон</h2>
            <div class="form-row">
                <input type="date" id="selectedDate">
                <button class="btn-gold" onclick="loadSlotsForDate()">Показать окна</button>
                <button class="btn-gold btn-standard-day" onclick="fillStandardDay()">+ Стандартный день (11:00, 14:00, 16:30, 19:00)</button>
            </div>

            <div class="quick-presets">
                <p>Быстро добавить окно на эту дату:</p>
                <div class="preset-buttons">
                    <button class="preset-btn" onclick="addSingleSlot('10:00')">+ 10:00</button>
                    <button class="preset-btn" onclick="addSingleSlot('11:30')">+ 11:30</button>
                    <button class="preset-btn" onclick="addSingleSlot('13:00')">+ 13:00</button>
                    <button class="preset-btn" onclick="addSingleSlot('14:30')">+ 14:30</button>
                    <button class="preset-btn" onclick="addSingleSlot('16:00')">+ 16:00</button>
                    <button class="preset-btn" onclick="addSingleSlot('17:30')">+ 17:30</button>
                    <button class="preset-btn" onclick="addSingleSlot('19:00')">+ 19:00</button>
                    <button class="preset-btn" onclick="addSingleSlot('20:30')">+ 20:30</button>
                </div>
            </div>

            <div class="custom-time-row">
                <input type="time" id="customTime">
                <button class="btn-gold" onclick="addCustomSlot()">Добавить другое время</button>
            </div>
        </div>

        <div class="schedule-card">
            <h2>2. Доступные окна на выбранную дату: <span id="currentDateTitle" class="current-date-title"></span></h2>
            <div id="slotsContainer" class="slots-list">
                <!-- Слоты заполняются JS -->
            </div>
        </div>
    </div>

</div>

<script src="common.js"></script>
<script>
    // Авторизация по сессионному токену
    if (sessionStorage.getItem('adminToken')) {
        showSchedule();
    }

    async function checkAdminPassword() {
        const pass = document.getElementById('adminPassInput').value;
        const errDiv = document.getElementById('loginError');

        try {
            const res = await fetch(`${API_BASE}/api/admin/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(pass)
            });

            if (res.ok) {
                const data = await res.json();
                sessionStorage.setItem('adminToken', data.token);
                errDiv.style.display = 'none';
                showSchedule();
            } else {
                errDiv.style.display = 'block';
            }
        } catch (e) {
            errDiv.style.display = 'block';
        }
    }

    document.getElementById('adminPassInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') checkAdminPassword();
    });

    function showSchedule() {
        document.getElementById('loginBox').classList.add('hidden');
        document.getElementById('scheduleApp').classList.remove('hidden');

        // Устанавливаем сегодняшнюю дату по умолчанию
        const today = new Date().toISOString().split('T')[0];
        const dateInput = document.getElementById('selectedDate');
        dateInput.value = today;
        loadSlotsForDate();
    }

    async function loadSlotsForDate() {
        const date = document.getElementById('selectedDate').value;
        if (!date) return;

        document.getElementById('currentDateTitle').textContent = date;
        const container = document.getElementById('slotsContainer');
        container.innerHTML = '<p class="slots-msg-loading">Загрузка окон...</p>';

        try {
            const res = await fetch(`${API_BASE}/api/slots/all?date=${encodeURIComponent(date)}`, {
                headers: getAuthHeaders()
            });

            if (res.status === 401) {
                alert('Сессия истекла. Войдите снова.');
                sessionStorage.removeItem('adminToken');
                location.reload();
                return;
            }

            if (res.ok) {
                const slots = await res.json();
                container.innerHTML = '';

                if (slots.length === 0) {
                    container.innerHTML = '<p class="slots-msg-empty">На этот день еще нет окон. Нажмите на кнопки выше, чтобы добавить окна для клиентов.</p>';
                    return;
                }

                slots.forEach(s => {
                    const pill = document.createElement('div');
                    pill.className = `slot-pill ${s.booked ? 'booked' : ''}`;

                    const infoDiv = document.createElement('div');
                    const timeDiv = document.createElement('div');
                    timeDiv.className = 'slot-time';
                    timeDiv.textContent = s.slotTime || '';
                    infoDiv.appendChild(timeDiv);

                    const badge = document.createElement('span');
                    badge.className = `slot-badge ${s.booked ? 'badge-busy' : 'badge-free'}`;
                    badge.textContent = s.booked ? 'Занято' : 'Свободно';
                    infoDiv.appendChild(badge);

                    const delBtn = document.createElement('button');
                    delBtn.className = 'btn-del-slot';
                    delBtn.textContent = '✕';
                    delBtn.title = 'Удалить окно';
                    delBtn.onclick = () => deleteSlot(s.id);

                    pill.appendChild(infoDiv);
                    pill.appendChild(delBtn);
                    container.appendChild(pill);
                });
            }
        } catch (e) {
            container.innerHTML = '<p class="slots-msg-error">Ошибка загрузки окон.</p>';
        }
    }

    async function addSingleSlot(timeStr) {
        const date = document.getElementById('selectedDate').value;
        if (!date) {
            alert('Пожалуйста, выберите дату!');
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/api/slots`, {
                method: 'POST',
                headers: getAuthHeaders(),
                body: JSON.stringify({ slotDate: date, slotTime: timeStr })
            });

            if (res.status === 401) {
                alert('Требуется авторизация');
                return;
            }

            loadSlotsForDate();
        } catch (e) {
            alert('Ошибка при добавлении окна');
        }
    }

    async function addCustomSlot() {
        const timeVal = document.getElementById('customTime').value;
        if (!timeVal) {
            alert('Укажите время!');
            return;
        }
        await addSingleSlot(timeVal);
        document.getElementById('customTime').value = '';
    }

    async function fillStandardDay() {
        const times = ['11:00', '14:00', '16:30', '19:00'];
        for (const t of times) {
            await addSingleSlot(t);
        }
    }

    async function deleteSlot(id) {
        if (!confirm('Удалить это окно записи?')) return;
        try {
            const res = await fetch(`${API_BASE}/api/slots/${id}`, {
                method: 'DELETE',
                headers: getAuthHeaders()
            });

            if (res.status === 401) {
                alert('Требуется авторизация');
                return;
            }

            if (res.ok) {
                loadSlotsForDate();
            }
        } catch (e) {
            alert('Ошибка сети при удалении');
        }
    }
</script>
</body>
</html>
