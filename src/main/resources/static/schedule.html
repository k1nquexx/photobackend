<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление окнами для записи | Фотограф</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, Arial, sans-serif; }
        body { background-color: #0c0c0c; color: #eee; padding: 25px; }
        .container { max-width: 1000px; margin: 0 auto; }

        /* Вход */
        #loginBox {
            max-width: 380px;
            margin: 100px auto;
            background: #181818;
            padding: 35px;
            border-radius: 8px;
            border: 1px solid #333;
            text-align: center;
        }
        #loginBox h2 { color: #e6cc98; margin-bottom: 20px; }
        #loginBox input {
            width: 100%;
            padding: 12px;
            background: #252525;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 16px;
        }
        #loginBox button {
            width: 100%;
            padding: 12px;
            background: #e6cc98;
            border: none;
            color: #111;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
        }
        #loginError { color: #ea868f; margin-top: 10px; font-size: 14px; display: none; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #282828;
        }
        .header h1 { color: #e6cc98; font-size: 26px; }
        .header a { color: #aaa; text-decoration: none; font-size: 14px; border: 1px solid #444; padding: 8px 14px; border-radius: 4px; }
        .header a:hover { color: #fff; border-color: #e6cc98; }

        .schedule-card {
            background: #181818;
            border: 1px solid #282828;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 30px;
        }
        .schedule-card h2 { font-size: 18px; color: #e6cc98; margin-bottom: 15px; }

        .form-row {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        input[type="date"], input[type="time"] {
            background: #252525;
            border: 1px solid #444;
            color: #fff;
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 15px;
        }

        .btn-gold {
            background: #e6cc98;
            color: #111;
            border: none;
            padding: 10px 18px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-gold:hover { background: #d4ba88; }

        /* Быстрые кнопки слотов */
        .quick-presets { margin-top: 15px; }
        .quick-presets p { font-size: 13px; color: #888; margin-bottom: 8px; text-transform: uppercase; }
        .preset-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .preset-btn {
            background: #222;
            border: 1px solid #444;
            color: #ddd;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .preset-btn:hover { border-color: #e6cc98; color: #e6cc98; background: #282828; }

        /* Список слотов */
        .slots-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .slot-pill {
            background: #202020;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .slot-pill.booked {
            border-color: #8b1c1c;
            background: #1e1414;
        }
        .slot-time { font-size: 18px; font-weight: bold; color: #e6cc98; }
        .slot-pill.booked .slot-time { color: #ea868f; text-decoration: line-through; }
        .slot-badge { font-size: 11px; padding: 2px 6px; border-radius: 3px; }
        .badge-free { background: #13281e; color: #75b798; }
        .badge-busy { background: #381616; color: #ea868f; }

        .btn-del-slot {
            background: none;
            border: none;
            color: #888;
            font-size: 18px;
            cursor: pointer;
            padding: 0 5px;
        }
        .btn-del-slot:hover { color: #ea868f; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">

    <!-- Форма входа -->
    <div id="loginBox">
        <h2>🔒 Вход в управление окнами</h2>
        <input type="password" id="adminPassInput" placeholder="Введите пароль..." autofocus>
        <button onclick="checkAdminPassword()">Войти</button>
        <div id="loginError">Неверный пароль!</div>
    </div>

    <!-- Основная часть расписания -->
    <div id="scheduleApp" class="hidden">
        <div class="header">
            <h1>📅 Управление окнами записи</h1>
            <a href="admin.html">← В админку заявок</a>
        </div>

        <div class="schedule-card">
            <h2>1. Выберите дату для настройки окон</h2>
            <div class="form-row">
                <input type="date" id="selectedDate">
                <button class="btn-gold" onclick="loadSlotsForDate()">Показать окна</button>
                <button class="btn-gold" style="background:#333; color:#fff;" onclick="fillStandardDay()">+ Стандартный день (11:00, 14:00, 16:30, 19:00)</button>
            </div>

            <div class="quick-presets">
                <p>Быстро добавить окно на эту дату:</p>
                <div class="preset-buttons">
                    <button class="preset-btn" onclick="addSingleSlot('10:00')">+ 10:00</button>
                    <button class="preset-btn" onclick="addSingleSlot('11:30')">+ 11:30</button>
                    <button class="preset-btn" onclick="addSingleSlot('13:00')">+ 13:00</button>
                    <button class="preset-btn" onclick="addSingleSlot('14:30')">+ 14:30</button>
                    <button class="preset-btn" onclick="addSingleSlot('16:00')">+ 16:00</button>
                    <button class="preset-btn" onclick="addSingleSlot('17:30')">+ 17:30</button>
                    <button class="preset-btn" onclick="addSingleSlot('19:00')">+ 19:00</button>
                    <button class="preset-btn" onclick="addSingleSlot('20:30')">+ 20:30</button>
                </div>
            </div>

            <div style="margin-top: 20px; display: flex; gap: 10px; align-items: center;">
                <input type="time" id="customTime">
                <button class="btn-gold" onclick="addCustomSlot()">Добавить другое время</button>
            </div>
        </div>

        <div class="schedule-card">
            <h2>2. Доступные окна на выбранную дату: <span id="currentDateTitle" style="color:#fff;"></span></h2>
            <div id="slotsContainer" class="slots-list">
                <!-- Слоты заполняются JS -->
            </div>
        </div>
    </div>

</div>

<script src="common.js"></script>
<script>
    // Авторизация по сессионному токену
    if (sessionStorage.getItem('adminToken')) {
        showSchedule();
    }

    async function checkAdminPassword() {
        const pass = document.getElementById('adminPassInput').value;
        const errDiv = document.getElementById('loginError');

        try {
            const res = await fetch(`${API_BASE}/api/admin/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(pass)
            });

            if (res.ok) {
                const data = await res.json();
                sessionStorage.setItem('adminToken', data.token);
                errDiv.style.display = 'none';
                showSchedule();
            } else {
                errDiv.style.display = 'block';
            }
        } catch (e) {
            errDiv.style.display = 'block';
        }
    }

    document.getElementById('adminPassInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') checkAdminPassword();
    });

    function showSchedule() {
        document.getElementById('loginBox').classList.add('hidden');
        document.getElementById('scheduleApp').classList.remove('hidden');

        // Устанавливаем сегодняшнюю дату по умолчанию
        const today = new Date().toISOString().split('T')[0];
        const dateInput = document.getElementById('selectedDate');
        dateInput.value = today;
        loadSlotsForDate();
    }

    async function loadSlotsForDate() {
        const date = document.getElementById('selectedDate').value;
        if (!date) return;

        document.getElementById('currentDateTitle').textContent = date;
        const container = document.getElementById('slotsContainer');
        container.innerHTML = '<p style="color:#888;">Загрузка окон...</p>';

        try {
            const res = await fetch(`${API_BASE}/api/slots/all?date=${encodeURIComponent(date)}`, {
                headers: getAuthHeaders()
            });

            if (res.status === 401) {
                alert('Сессия истекла. Войдите снова.');
                sessionStorage.removeItem('adminToken');
                location.reload();
                return;
            }

            if (res.ok) {
                const slots = await res.json();
                container.innerHTML = '';

                if (slots.length === 0) {
                    container.innerHTML = '<p style="color:#888; grid-column:1/-1;">На этот день еще нет окон. Нажмите на кнопки выше, чтобы добавить окна для клиентов.</p>';
                    return;
                }

                slots.forEach(s => {
                    const pill = document.createElement('div');
                    pill.className = `slot-pill ${s.booked ? 'booked' : ''}`;

                    const infoDiv = document.createElement('div');
                    const timeDiv = document.createElement('div');
                    timeDiv.className = 'slot-time';
                    timeDiv.textContent = s.slotTime || '';
                    infoDiv.appendChild(timeDiv);

                    const badge = document.createElement('span');
                    badge.className = `slot-badge ${s.booked ? 'badge-busy' : 'badge-free'}`;
                    badge.textContent = s.booked ? 'Занято' : 'Свободно';
                    infoDiv.appendChild(badge);

                    const delBtn = document.createElement('button');
                    delBtn.className = 'btn-del-slot';
                    delBtn.textContent = '✕';
                    delBtn.title = 'Удалить окно';
                    delBtn.onclick = () => deleteSlot(s.id);

                    pill.appendChild(infoDiv);
                    pill.appendChild(delBtn);
                    container.appendChild(pill);
                });
            }
        } catch (e) {
            container.innerHTML = '<p style="color:#ea868f;">Ошибка загрузки окон.</p>';
        }
    }

    async function addSingleSlot(timeStr) {
        const date = document.getElementById('selectedDate').value;
        if (!date) {
            alert('Пожалуйста, выберите дату!');
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/api/slots`, {
                method: 'POST',
                headers: getAuthHeaders(),
                body: JSON.stringify({ slotDate: date, slotTime: timeStr })
            });

            if (res.status === 401) {
                alert('Требуется авторизация');
                return;
            }

            loadSlotsForDate();
        } catch (e) {
            alert('Ошибка при добавлении окна');
        }
    }

    async function addCustomSlot() {
        const timeVal = document.getElementById('customTime').value;
        if (!timeVal) {
            alert('Укажите время!');
            return;
        }
        await addSingleSlot(timeVal);
        document.getElementById('customTime').value = '';
    }

    async function fillStandardDay() {
        const times = ['11:00', '14:00', '16:30', '19:00'];
        for (const t of times) {
            await addSingleSlot(t);
        }
    }

    async function deleteSlot(id) {
        if (!confirm('Удалить это окно записи?')) return;
        try {
            const res = await fetch(`${API_BASE}/api/slots/${id}`, {
                method: 'DELETE',
                headers: getAuthHeaders()
            });

            if (res.status === 401) {
                alert('Требуется авторизация');
                return;
            }

            if (res.ok) {
                loadSlotsForDate();
            }
        } catch (e) {
            alert('Ошибка сети при удалении');
        }
    }
</script>
</body>
</html>
